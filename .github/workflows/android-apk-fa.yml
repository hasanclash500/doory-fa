name: Build Doory FA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/src/i18n/**'
      - 'frontend/src/app/routes.tsx'
      - 'frontend/src/app/OfflineBanner.tsx'
      - 'frontend/src/features/auth/AuthProvider.tsx'
      - 'frontend/src/lib/nativeMobile.ts'
      - 'frontend/src/pages/MobileHomePage.tsx'
      - 'frontend/src/features/editor/adapters/guestAdapter.ts'
      - 'frontend/src/pages/LocalEditorPage.tsx'
      - 'frontend/src/editor/panels/StickerPanel.tsx'
      - 'frontend/src/editor/TopBar.tsx'
      - 'frontend/src/editor/builtins/panels.tsx'
      - 'frontend/src/editor/builtins/commands.tsx'
      - 'frontend/src/editor/fonts/useFontUploadEntry.ts'
      - 'frontend/src/editor/fonts/UploadFontDialog.tsx'
      - 'frontend/src/editor/fonts/UploadFontDialog.module.css'
      - 'frontend/src/editor/fonts/useFontUploadEntry.test.tsx'
      - 'frontend/src/lib/offlineLibraries.ts'
      - 'frontend/src/lib/mobileOnline.ts'
      - 'frontend/src/main.tsx'
      - 'frontend/src/editor/strings.ts'
      - 'frontend/src/styles/global.css'
      - 'frontend/index.html'
      - 'frontend/capacitor.config.ts'
      - '.github/workflows/android-apk-fa.yml'

permissions:
  contents: read

concurrency:
  group: android-debug-apk
  cancel-in-progress: false

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out Persian Doory
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Check runner Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}" || {
            echo 'Android SDK not installed on the runner.' >&2
            exit 1
          }
      - name: Install frontend dependencies and Capacitor
        working-directory: frontend
        run: |
          # Keep browser plugin declared so Capacitor auto-discovers native BrowserPlugin.
          # npm install also reconciles the existing lockfile with new Capacitor dependencies.
          npm install --no-audit --no-fund
          test -d node_modules/@capacitor/browser
      - name: Test guest font upload dialog
        working-directory: frontend
        run: npx vitest run src/editor/fonts/useFontUploadEntry.test.tsx
      - name: Build Persian frontend
        working-directory: frontend
        run: npm run build
      - name: Verify offline standalone build
        shell: bash
        run: |
          test -f frontend/dist/index.html
          test -f frontend/capacitor.config.ts
          grep -q 'MobileHomePage' frontend/src/app/routes.tsx
          grep -q 'openOnlineDoory' frontend/src/pages/MobileHomePage.tsx
      - name: Generate Android project
        working-directory: frontend
        env:
          DOORY_APP_URL: ''
        run: |
          npx cap add android
          npx cap sync android
          test -f android/app/src/main/assets/capacitor.plugins.json
          grep -q 'BrowserPlugin' android/app/src/main/assets/capacitor.plugins.json
      - name: Build Android debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: doory-fa-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
