name: Build Doory FA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/src/i18n/**'
      - 'frontend/src/main.tsx'
      - 'frontend/src/editor/strings.ts'
      - 'frontend/src/styles/global.css'
      - 'frontend/index.html'
      - 'frontend/capacitor.config.ts'
      - '.github/workflows/android-apk-fa.yml'

permissions:
  contents: read

concurrency:
  group: android-debug-apk
  cancel-in-progress: false

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out Persian Doory
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install frontend dependencies and Capacitor
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save @capacitor/core@^8 @capacitor/android@^8 @capacitor/cli@^8
      - name: Build Persian frontend
        working-directory: frontend
        run: npm run build
      - name: Generate Android project
        working-directory: frontend
        env:
          DOORY_APP_URL: ${{ vars.DOORY_APP_URL }}
        run: |
          npx cap add android
          npx cap sync android
      - name: Build Android debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: doory-fa-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
